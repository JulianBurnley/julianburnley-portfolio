name: Update climate briefing

on:
  schedule:
    - cron: "15 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: climate-briefing
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Collect approved climate feeds
        run: node scripts/update-climate-briefing.mjs

      - name: Publish changes when articles are new
        run: |
          if git diff --quiet -- climate-action/data/articles.json; then
            echo "No article changes."
            exit 0
          fi
          git config user.name "Climate Briefing Bot"
          git config user.email "actions@users.noreply.github.com"
          git add climate-action/data/articles.json
          git commit -m "Update climate briefing"
          git push
